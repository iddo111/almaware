[platformio]
default_envs = unihiker_k10_compile_only

[env:unihiker_k10_compile_only]
platform = https://github.com/DFRobot/platform-unihiker.git#508e31875ad92205bf946e28570fb78fc01ceb2e
platform_packages =
    framework-arduinounihiker @ https://github.com/DFRobot/framework-arduinounihiker.git#9fabfd6d6324dbb304ad47947675baf7cf1ab29e
board = unihiker_k10
framework = arduino
board_build.arduino.upstream_packages = no
upload_port = COMPILE_ONLY_DO_NOT_UPLOAD
monitor_port = COMPILE_ONLY_DO_NOT_OPEN
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
    -Wall
    -Wextra
