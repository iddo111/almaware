; ALMA-OS for LILYGO T-Deck (ESP32-S3, 16MB flash, 8MB OPI PSRAM)
; Build:  pio run          Flash:  pio run -t upload          Monitor: pio device monitor
; Purity note: no external libraries (no RadioLib/TFT_eSPI/LVGL) — drivers are ours.
; The only dependency is the Espressif Arduino core (platform/toolchain level).
;
; לזכרה של עלמה ז"ל · ALMAWARE

; With a second env present, a bare `pio run` would build BOTH. Pin the default
; back to the hardware build so `pio run` / `pio run -t upload` behave exactly as
; they did before the emulator env existed. Use `pio run -e qemu` for the sim image.
[platformio]
default_envs = tdeck

[env:tdeck]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

monitor_speed = 115200
upload_speed = 921600

; ---------------------------------------------------------------------------
; [env:qemu] — ADDITIVE, 2026-09-06. Does NOT change the tdeck build above.
; Same sources, two build flags relaxed so the image can run under
; Espressif QEMU (sim/tools/qemu), which emulates neither OPI PSRAM nor USB-CDC:
;   * PSRAM off      — QEMU has no OPI PSRAM chip; the stock image aborts at
;                      "spiram: SPI RAM enabled but initialization failed".
;                      v0.1 uses 7.7% of internal RAM and never touches PSRAM.
;   * USB CDC off    — QEMU has no USB device, so Serial must go to UART0.
; Everything else (pins, drivers, UI, mesh) is byte-identical to [env:tdeck].
; NEVER flash this env to hardware — use [env:tdeck].
; ---------------------------------------------------------------------------
[env:qemu]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DALMA_QEMU=1
    -Wall

monitor_speed = 115200
