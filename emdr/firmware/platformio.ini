; ALMA-EMDR buzzer firmware
; -----------------------------------------------------------------------------
; Build:   pio run -e ball
;          pio run -e bridge
; Flash:   pio run -e ball -t upload
;
; On Windows set PYTHONIOENCODING=utf-8 first, or the PlatformIO CLI throws a
; UnicodeEncodeError before it ever reaches the compiler.
;
; The platform version is PINNED. espressif32 6.13.0 ships Arduino-ESP32 2.0.16
; (ESP-IDF 4.4). The sources also compile on Arduino-ESP32 3.x - every API that
; changed is guarded on ESP_ARDUINO_VERSION_MAJOR - but 6.13.0 is what this was
; built and verified against.

[env]
platform      = espressif32@6.13.0
framework     = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags   =
  -std=gnu++17
  -Wall
  -DCORE_DEBUG_LEVEL=0
; BLE + Wi-Fi + ESP-NOW together do not fit the 1.2 MB default app partition.
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
; THE BALL - the thing in the hand. One ERM motor, BLE peripheral + ESP-NOW.
; ---------------------------------------------------------------------------
[env:ball]
board       = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DEMDR_ROLE_BALL=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:ball_xiao]
board       = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DEMDR_ROLE_BALL=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; THE BRIDGE - the box on the desk. USB in; two wired jacks and ESP-NOW out.
; This is Phase 1 and Phase 3 of the build order, same firmware.
; ---------------------------------------------------------------------------
[env:bridge]
board       = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DEMDR_ROLE_BRIDGE=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:bridge_xiao]
board       = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DEMDR_ROLE_BRIDGE=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
